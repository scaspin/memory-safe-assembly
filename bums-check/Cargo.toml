[package]
name = "bums-check"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bums-check"
path = "src/main.rs"

[dependencies]
bums_annotations = { path = "../bums_annotations" }
env_logger = "0.11"
proc-macro2 = "1.0.78"
quote = "1.0.35"
regex = "1"
serde_json = "1"
syn = {version = "2.0.49", features = ["full", "extra-traits", "parsing"]}
