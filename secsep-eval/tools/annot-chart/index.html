<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annotations vs Verification Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one column, chart first, controls in one row above it, table below */
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --ink: #141413;
  --ink-2: #55544f;
  --ink-3: #8a8983;
  --rule: #e4e3de;
  --grid: #efeeea;
  --bums: #2a78d6;
  --secsep: #eb6834;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --surface: #1d1d1c; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
    --rule: #33332f; --grid: #282826; --bums: #3987e5; --secsep: #d95926; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --surface: #1d1d1c; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8f8e86;
  --rule: #33332f; --grid: #282826; --bums: #3987e5; --secsep: #d95926; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.page { max-width: 1040px; margin: 0 auto; padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.lede { color: var(--ink-2); margin: 6px 0 0; max-width: 68ch; }
.controls { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 6px 12px; background: var(--surface); color: var(--ink-2); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible { outline: 2px solid var(--bums); outline-offset: -2px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-right: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-wrap { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 8px 4px; position: relative; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text { fill: var(--ink-3); font-family: var(--mono); font-size: 11px; }
.axis-title { fill: var(--ink-2); font-size: 12px; font-family: var(--sans); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.pt { cursor: pointer; transition: opacity .15s; }
.dim .pt:not(.hot) { opacity: .18; }
.link { stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 220px; max-width: 320px; z-index: 5; }
.tip b { font-family: var(--mono); font-weight: 500; font-size: 13px; }
.tip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tip .row strong { color: var(--ink); font-weight: 500; }
.tip .sw { display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: 1px; }
.notes { color: var(--ink-2); font-size: 13.5px; max-width: 76ch; display: grid; gap: 6px; }
.notes p { margin: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 12px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { font-weight: 500; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align: left; }
td:first-child { font-family: var(--mono); }
tr:last-child td { border-bottom: 0; }
.status { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--rule); color: var(--ink-2); }
.status.fail { border-color: var(--ink-3); color: var(--ink); font-weight: 500; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
@media (prefers-reduced-motion: reduce) { .pt { transition: none; } }
</style>

</head>
<body>
<div class="page">
  <header>
    <h1>Annotations vs verification time</h1>
    <p class="lede">The 21 functions both tools analyse in SecSep's six BoringSSL benchmarks (clang 16, x86-64). Each function has one point per tool. Hover a point to see the same function under the other tool.</p>
  </header>

  <div class="controls">
    <div><span class="label">Annotation size</span><span class="seg" role="group" aria-label="Annotation measure">
      <button id="m-clauses" aria-pressed="true" data-m="clauses">Clauses</button><button id="m-tokens" aria-pressed="false" data-m="tokens">Tokens</button>
    </span></div>
    <div class="legend" aria-hidden="true">
      <span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--bums)"/></svg>BUMS verified</span>
      <span><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" rx="1.5" fill="var(--secsep)"/></svg>SecSep (all type-check)</span>
    </div>
  </div>

  <div class="chart-wrap" id="wrap">
    <svg id="chart" viewBox="0 0 980 520" role="img" aria-label="Scatter of annotation size against verification time, log scale, BUMS and SecSep"></svg>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="notes" id="notes"></div>

  <h2>All functions</h2>
  <div class="table-wrap"><table id="tbl"></table></div>
</div>

<script>
const POINTS = [{"fn": "salsa20_words", "bench": "salsa20", "bums": {"clauses": 2, "tokens": 34, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 2, "tokens": 22, "time": 13.05, "phases": {"single": 2.27, "taint": 1.96, "range": 1.09, "check": 7.73}, "queries": 1875}}, {"fn": "salsa20", "bench": "salsa20", "bums": {"clauses": 4, "tokens": 44, "status": "verified", "time": 1.6, "reason": ""}, "secsep": {"clauses": 4, "tokens": 40, "time": 10.07, "phases": {"single": 2.56, "taint": 0.85, "range": 0.42, "check": 6.24}, "queries": 1610}}, {"fn": "chacha_core", "bench": "chacha20", "bums": {"clauses": 2, "tokens": 34, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 2, "tokens": 15, "time": 1.01, "phases": {"single": 0.18, "range": 0.09, "taint": 0.07, "check": 0.67}, "queries": 495}}, {"fn": "CRYPTO_chacha_20", "bench": "chacha20", "bums": {"clauses": 7, "tokens": 86, "status": "verified", "time": 58.4, "reason": ""}, "secsep": {"clauses": 10, "tokens": 86, "time": 200.18, "phases": {"single": 102.22, "range": 24.44, "taint": 12.92, "check": 60.6}, "queries": 10016}}, {"fn": "CRYPTO_poly1305_init", "bench": "poly1305", "bums": {"clauses": 2, "tokens": 50, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 3, "tokens": 27, "time": 1.5, "phases": {"range": 0.01, "taint": 0.0, "check": 1.43, "single": 0.05}, "queries": 253}}, {"fn": "CRYPTO_poly1305_update", "bench": "poly1305", "bums": {"clauses": 4, "tokens": 62, "status": "verified", "time": 227.0, "reason": ""}, "secsep": {"clauses": 21, "tokens": 274, "time": 827.83, "phases": {"range": 65.97, "taint": 12.25, "check": 518.23, "single": 231.38}, "queries": 10199}}, {"fn": "CRYPTO_poly1305_finish", "bench": "poly1305", "bums": {"clauses": 3, "tokens": 59, "status": "verified", "time": 5.8, "reason": ""}, "secsep": {"clauses": 18, "tokens": 246, "time": 11.41, "phases": {"range": 0.53, "taint": 0.72, "check": 8.65, "single": 1.52}, "queries": 1044}}, {"fn": "poly1305_donna_mul", "bench": "poly1305", "bums": {"clauses": 1, "tokens": 35, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 19, "tokens": 249, "time": 3.8, "phases": {"range": 0.01, "taint": 0.21, "check": 3.56, "single": 0.01}, "queries": 269}}, {"fn": "poly1305_update", "bench": "poly1305", "bums": {"clauses": 3, "tokens": 54, "status": "verified", "time": 23.8, "reason": ""}, "secsep": {"clauses": 23, "tokens": 288, "time": 86.74, "phases": {"range": 7.03, "taint": 4.05, "check": 42.38, "single": 33.3}, "queries": 6590}}, {"fn": "sha512_block_data_order", "bench": "sha512", "bums": {"clauses": 4, "tokens": 50, "status": "verified", "time": 1.0, "reason": ""}, "secsep": {"clauses": 4, "tokens": 44, "time": 90.07, "phases": {"single": 7.36, "range": 13.26, "taint": 16.99, "check": 52.47}, "queries": 4444}}, {"fn": "SHA512", "bench": "sha512", "bums": {"clauses": 3, "tokens": 40, "status": "verified", "time": 11.6, "reason": ""}, "secsep": {"clauses": 3, "tokens": 28, "time": 110.05, "phases": {"single": 38.81, "range": 8.94, "taint": 6.85, "check": 55.45}, "queries": 5490}}, {"fn": "fe_mul_impl", "bench": "x25519", "bums": {"clauses": 3, "tokens": 49, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 7, "tokens": 54, "time": 8.49, "phases": {"taint": 1.38, "range": 0.01, "check": 6.76, "single": 0.34}, "queries": 589}}, {"fn": "fe_tobytes", "bench": "x25519", "bums": {"clauses": 2, "tokens": 34, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 1, "tokens": 14, "time": 18.21, "phases": {"taint": 0.2, "range": 0.01, "check": 16.54, "single": 1.47}, "queries": 680}}, {"fn": "fe_loose_invert", "bench": "x25519", "bums": {"clauses": 2, "tokens": 34, "status": "verified", "time": 2.9, "reason": ""}, "secsep": {"clauses": 1, "tokens": 14, "time": 210.85, "phases": {"taint": 2.03, "range": 20.55, "check": 142.86, "single": 45.41}, "queries": 8901}}, {"fn": "X25519", "bench": "x25519", "bums": {"clauses": 3, "tokens": 51, "status": "verified", "time": 114.8, "reason": ""}, "secsep": {"clauses": 5, "tokens": 36, "time": 512.13, "phases": {"taint": 7.28, "range": 17.47, "check": 353.8, "single": 133.58}, "queries": 6871}}, {"fn": "ge_madd", "bench": "ed25519_sign", "bums": {"clauses": 3, "tokens": 49, "status": "verified", "time": 0.2, "reason": ""}, "secsep": {"clauses": 7, "tokens": 112, "time": 26.21, "phases": {"single": 8.48, "taint": 0.22, "check": 17.48, "range": 0.02}, "queries": 1783}}, {"fn": "ge_p2_dbl", "bench": "ed25519_sign", "bums": {"clauses": 2, "tokens": 34, "status": "verified", "time": 0.2, "reason": ""}, "secsep": {"clauses": 3, "tokens": 48, "time": 15.27, "phases": {"single": 0.78, "taint": 1.05, "check": 13.42, "range": 0.02}, "queries": 996}}, {"fn": "table_select", "bench": "ed25519_sign", "bums": {"clauses": 5, "tokens": 41, "status": "verified", "time": 0.2, "reason": ""}, "secsep": {"clauses": 1, "tokens": 10, "time": 91.76, "phases": {"single": 43.6, "taint": 5.38, "check": 37.1, "range": 5.68}, "queries": 5538}}, {"fn": "x25519_ge_scalarmult_base", "bench": "ed25519_sign", "bums": {"clauses": 2, "tokens": 34, "status": "verified", "time": 29.8, "reason": ""}, "secsep": {"clauses": 2, "tokens": 15, "time": 219.04, "phases": {"single": 63.91, "taint": 8.09, "check": 142.08, "range": 4.96}, "queries": 8825}}, {"fn": "x25519_sc_reduce", "bench": "ed25519_sign", "bums": {"clauses": 1, "tokens": 19, "status": "verified", "time": 0.1, "reason": ""}, "secsep": {"clauses": 1, "tokens": 12, "time": 9.03, "phases": {"single": 3.41, "taint": 0.22, "check": 5.4, "range": 0.01}, "queries": 1327}}, {"fn": "ED25519_sign", "bench": "ed25519_sign", "bums": {"clauses": 4, "tokens": 55, "status": "verified", "time": 891.0, "reason": ""}, "secsep": {"clauses": 5, "tokens": 43, "time": 1778.31, "phases": {"single": 719.63, "taint": 41.24, "check": 867.96, "range": 149.47}, "queries": 34526}}];
const NOTES = ["<strong>SecSep time</strong> is CPU time spent on that function in Octal's four solver-backed phases (dependent type, valid region, taint, type check), measured with per-function timers added to Octal. A caller reuses the interfaces already inferred for its callees.", "<strong>BUMS time</strong> is wall-clock time of one <code>bums-check</code> child process, one function at a time. BUMS re-executes every callee inside its caller.", "<strong>Clauses</strong>: for SecSep, each <code>@valid</code>, <code>@size</code>, <code>@taint</code>, <code>@const</code>, <code>@overlap</code>, <code>@sym</code> or <code>@unit</code> tag plus each <code>@secsep_in</code>/<code>@secsep_out</code> constraint. For BUMS, each argument binding plus each bracketed precondition. <strong>Tokens</strong> count identifiers, numbers and symbols in the annotation; for BUMS this includes the Rust signature, which is written by hand.", "All 21 functions verify in both tools. All BUMS times come from one sweep without logging, one function at a time."];
const W = 980, H = 520, M = { l: 64, r: 24, t: 16, b: 52 };
const svg = document.getElementById('chart'), tip = document.getElementById('tip'), wrap = document.getElementById('wrap');
let measure = 'clauses';
try { measure = localStorage.getItem('annot-measure') || 'clauses'; } catch (e) {}
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const fmtT = t => t >= 100 ? t.toFixed(0) + ' s' : t >= 10 ? t.toFixed(1) + ' s' : t.toFixed(2) + ' s';

function draw() {
  svg.innerHTML = '';
  const xs = POINTS.flatMap(p => [p.bums[measure], p.secsep[measure]]);
  const ts = POINTS.flatMap(p => [p.bums.time, p.secsep.time]).filter(t => t > 0);
  const xMax = Math.ceil(Math.max(...xs) * 1.06 / (measure === 'tokens' ? 50 : 5)) * (measure === 'tokens' ? 50 : 5);
  const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...ts)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...ts))));
  const X = v => M.l + v / xMax * (W - M.l - M.r);
  const Y = t => M.t + (1 - (Math.log10(Math.max(t, lo)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo))) * (H - M.t - M.b);
  const g = el('g', { class: 'axis' }, svg);
  for (let e = Math.log10(lo); e <= Math.log10(hi) + 1e-9; e++) {
    const t = Math.pow(10, e), y = Y(t);
    el('line', { x1: M.l, x2: W - M.r, y1: y, y2: y, class: 'gridline' }, g);
    const lab = t >= 60 ? (t >= 3600 ? (t / 3600) + ' h' : t >= 1000 ? (t / 60).toFixed(0) + ' min' : t + ' s') : t + ' s';
    el('text', { x: M.l - 8, y: y + 4, 'text-anchor': 'end' }, g).textContent = lab;
  }
  const step = measure === 'tokens' ? 50 : 5;
  for (let v = 0; v <= xMax; v += step) {
    const x = X(v);
    el('line', { x1: x, x2: x, y1: H - M.b, y2: H - M.b + 5, stroke: 'var(--ink-3)' }, g);
    el('text', { x, y: H - M.b + 19, 'text-anchor': 'middle' }, g).textContent = v;
  }
  el('line', { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, stroke: 'var(--ink-3)' }, g);
  el('text', { x: (M.l + W - M.r) / 2, y: H - 10, 'text-anchor': 'middle', class: 'axis-title' }, g).textContent =
    measure === 'clauses' ? 'Annotation clauses per function' : 'Annotation tokens per function';
  el('text', { x: 14, y: (M.t + H - M.b) / 2, 'text-anchor': 'middle', class: 'axis-title', transform: `rotate(-90 14 ${(M.t + H - M.b) / 2})` }, g).textContent = 'Time (log scale)';
  const link = el('path', { class: 'link', d: '' }, svg);
  const layer = el('g', {}, svg);
  POINTS.forEach((p, i) => {
    const sx = X(p.secsep[measure]), sy = Y(p.secsep.time), bx = X(p.bums[measure]), by = Y(p.bums.time);
    const s = el('rect', { x: sx - 5.5, y: sy - 5.5, width: 11, height: 11, rx: 1.5, fill: 'var(--secsep)', stroke: 'var(--surface)', 'stroke-width': 2, class: 'pt', 'data-i': i, 'data-tool': 'secsep', tabindex: 0 }, layer);
    const ok = p.bums.status === 'verified';
    const b = el('circle', { cx: bx, cy: by, r: ok ? 6 : 5, fill: ok ? 'var(--bums)' : 'var(--surface)', stroke: ok ? 'var(--surface)' : 'var(--bums)', 'stroke-width': ok ? 2 : 2.25, class: 'pt', 'data-i': i, 'data-tool': 'bums', tabindex: 0 }, layer);
    for (const m of [s, b]) {
      const on = () => { svg.classList.add('dim'); s.classList.add('hot'); b.classList.add('hot'); link.setAttribute('d', `M${bx},${by}L${sx},${sy}`); show(p, m); };
      const off = () => { svg.classList.remove('dim'); s.classList.remove('hot'); b.classList.remove('hot'); link.setAttribute('d', ''); tip.hidden = true; };
      m.addEventListener('pointerenter', on); m.addEventListener('pointerleave', off);
      m.addEventListener('focus', on); m.addEventListener('blur', off);
    }
  });
}

function show(p, mark) {
  const ph = p.secsep.phases, ok = p.bums.status === 'verified';
  tip.innerHTML = `<div style="margin-bottom:6px"><b>${p.fn}</b> <span style="color:var(--ink-3)">· ${p.bench}</span></div>
    <div class="row"><span><i class="sw" style="background:var(--bums);border-radius:50%"></i>BUMS ${ok ? '' : '(' + p.bums.status + ')'}</span><strong>${fmtT(p.bums.time)}</strong></div>
    <div class="row"><span style="padding-left:14px">${p.bums.clauses} clauses · ${p.bums.tokens} tokens</span></div>
    <div class="row" style="margin-top:6px"><span><i class="sw" style="background:var(--secsep)"></i>SecSep</span><strong>${fmtT(p.secsep.time)}</strong></div>
    <div class="row"><span style="padding-left:14px">${p.secsep.clauses} clauses · ${p.secsep.tokens} tokens</span></div>
    <div class="row"><span style="padding-left:14px">infer ${(+(ph.single||0) + +(ph.range||0) + +(ph.taint||0)).toFixed(1)} s · check ${(+(ph.check||0)).toFixed(1)} s · ${p.secsep.queries} SMT</span></div>
    ${ok || !p.bums.reason ? '' : `<div style="margin-top:6px;color:var(--ink-2);white-space:normal">${p.bums.reason.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`}`;
  tip.hidden = false;
  const r = mark.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  let left = r.left - w.left + 14, top = r.top - w.top - 10;
  if (left + tip.offsetWidth > w.width - 8) left = r.left - w.left - tip.offsetWidth - 14;
  if (top + tip.offsetHeight > w.height) top = w.height - tip.offsetHeight - 8;
  tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
}

function table() {
  const rows = [...POINTS].sort((a, b) => a.bench.localeCompare(b.bench) || a.fn.localeCompare(b.fn));
  document.getElementById('tbl').innerHTML = `<thead><tr><th>Function</th><th>Benchmark</th><th>BUMS clauses</th><th>BUMS tokens</th><th>BUMS time</th><th>BUMS result</th><th>SecSep clauses</th><th>SecSep tokens</th><th>SecSep time</th><th>SecSep SMT queries</th></tr></thead><tbody>` +
    rows.map(p => `<tr><td>${p.fn}</td><td>${p.bench}</td><td>${p.bums.clauses}</td><td>${p.bums.tokens}</td><td>${fmtT(p.bums.time)}</td><td><span class="status ${p.bums.status === 'verified' ? '' : 'fail'}">${p.bums.status}</span></td><td>${p.secsep.clauses}</td><td>${p.secsep.tokens}</td><td>${fmtT(p.secsep.time)}</td><td>${p.secsep.queries.toLocaleString()}</td></tr>`).join('') + '</tbody>';
}

document.getElementById('notes').innerHTML = NOTES.map(n => `<p>${n}</p>`).join('');
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  measure = b.dataset.m;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  try { localStorage.setItem('annot-measure', measure); } catch (e) {}
  draw();
}));
document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === measure));
draw(); table();
</script>

</body>
</html>
